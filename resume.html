<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Résumé — Aditya Kandula</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FFFFFF;
    --ink: #111827;
    --mid: #4B5563;
    --accent: #1D4ED8;
    --line: rgba(17,24,39,0.1);
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'IBM Plex Sans', sans-serif;
    --topbar: 108px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 60px;
    height: 68px;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .nav-logo { font-family: var(--serif); font-size: 1.2rem; font-weight: 400; text-decoration: none; color: var(--ink); }
  .nav-links { display: flex; gap: 36px; list-style: none; align-items: center; }
  .nav-links a { font-size: 0.76rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a.active { color: var(--accent); font-weight: 500; }

  /* ── SUB BAR ── */
  .resume-bar {
    position: fixed; top: 68px; left: 0; right: 0; z-index: 99;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 60px;
    height: 40px;
    background: #F8F9FB;
    border-bottom: 1px solid var(--line);
  }
  .resume-bar-title {
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--mid);
  }
  .download-btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 6px 18px; background: var(--accent); color: #fff;
    text-decoration: none; transition: background 0.2s;
  }
  .download-btn:hover { background: #2563EB; }

  /* ── PDF VIEWER ── */
  .pdf-viewer {
    position: fixed;
    top: var(--topbar);
    left: 0; right: 0; bottom: 0;
    background: #E5E7EB;
    display: flex;
    justify-content: center;
    padding: 28px 60px 32px;
    overflow: auto;
  }

  .pdf-viewer iframe {
    width: 100%;
    max-width: 820px;
    height: 100%;
    min-height: 500px;
    border: none;
    display: block;
    box-shadow: 0 4px 24px rgba(17,24,39,0.13);
  }

  /* Mobile fallback */
  .mobile-fallback {
    display: none;
    position: fixed;
    top: var(--topbar);
    left: 0; right: 0; bottom: 0;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    text-align: center; padding: 40px;
    background: #F8F9FB;
  }
  .mobile-fallback p { color: var(--mid); font-size: 0.95rem; line-height: 1.6; max-width: 320px; }
  .mobile-fallback a {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 14px 32px; background: var(--accent); color: #fff;
    text-decoration: none;
  }

  @media (max-width: 768px) {
    nav { padding: 16px 24px; }
    .nav-links { display: none; }
    .resume-bar { padding: 0 24px; }
    .pdf-viewer { display: none; }
    .mobile-fallback { display: flex; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Aditya Kandula</a>
  <ul class="nav-links">
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#experience">Experience</a></li>
    <li><a href="index.html#skills">Skills</a></li>
    <li><a href="resume.html" class="active">Résumé</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<div class="resume-bar">
  <span class="resume-bar-title">Aditya Kandula — Résumé</span>
  <a href="resume.pdf" download="Aditya_Kandula_Resume.pdf" class="download-btn">↓ Download</a>
</div>

<div class="pdf-viewer">
  <iframe src="resume.pdf#toolbar=1&navpanes=0&scrollbar=1&view=FitH" title="Aditya Kandula Resume"></iframe>
</div>

<!-- Mobile: PDF embed doesn't work well on phones -->
<div class="mobile-fallback">
  <p>PDF preview isn't available on mobile. Download the resume to view it.</p>
  <a href="resume.pdf" download="Aditya_Kandula_Resume.pdf">↓ Download Resume</a>
</div>

</body>
</html>
